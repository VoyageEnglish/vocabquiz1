<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>English Quiz</title>

    <style>

        * {
            box-sizing: border-box;
        }
    
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }
    
        body {
            font-family: Arial, sans-serif;
    
            /* Main background */
            background: #f2f4f7;
    
            /* Main text color */
            color: #202124;
    
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
        }
    
    
        /* ==========================================
           MAIN QUIZ CONTAINER
           ========================================== */
    
        .quiz {
            width: 100%;
            max-width: 700px;
    
            margin: 0 auto;
    
            padding: 20px 16px 40px;
        }
    
    
        /* ==========================================
           PROGRESS
           ========================================== */
    
        #progress {
            font-size: 15px;
    
            color: #6b7280;
    
            margin-bottom: 8px;
    
            font-weight: 500;
        }
    
    
        /* ==========================================
           SCORE
           ========================================== */
    
        #score {
            font-size: 18px;
    
            color: #1f2937;
    
            font-weight: bold;
    
            margin-bottom: 28px;
        }
    
    
        /* ==========================================
           QUESTION
           ========================================== */
    
        #question {
            font-size: 20px;
    
            line-height: 1.55;
    
            font-weight: 700;
    
            color: #111827;
    
            margin-bottom: 25px;
        }
    
    
        /* ==========================================
           OPTIONS
           ========================================== */
    
        .option {
            display: block;
    
            width: 100%;
    
            min-height: 60px;
    
            padding: 16px 18px;
    
            margin-bottom: 13px;
    
            font-family: Arial, sans-serif;
    
            font-size: 15px;
    
            line-height: 1.2;
    
            text-align: left;
    
            color: #1f2937;
    
            background: #ffffff;
    
            border: 2px solid #d1d5db;
    
            border-radius: 12px;
    
            cursor: pointer;
    
            touch-action: manipulation;
    
            -webkit-appearance: none;
    
            transition:
                background-color 0.15s,
                border-color 0.15s,
                transform 0.1s;
        }
    
    
        /* Touch feedback */
    
        .option:active {
            background: #eef2ff;
    
            transform: scale(0.99);
        }
    
        .option.correct {
            color: #166534;
    
            background: #dcfce7;
    
            border-color: #22c55e;
        }
    
    
        /* ==========================================
           WRONG ANSWER
           ========================================== */
    
        .option.wrong {
            color: #991b1b;
    
            background: #fee2e2;
    
            border-color: #ef4444;
        }
    
    
        /* ==========================================
           FEEDBACK
           ========================================== */
    
        #feedback {
            min-height: 28px;
    
            margin-top: 20px;
    
            font-size: 18px;
    
            line-height: 1.4;
    
            font-weight: bold;
    
            color: #374151;
        }
    
    
        /* ==========================================
           FINAL RESULT
           ========================================== */
    
        #result {
            text-align: center;
    
            font-size: 25px;
    
            font-weight: bold;
    
            color: #111827;
    
            margin-top: 50px;
    
            line-height: 1.6;
        }
    
    

        /* ==========================================
           RESTART BUTTON
           ========================================== */

        #restartButton {
            display: none;
            width: 100%;
            max-width: 400px;
            min-height: 54px;
            margin: 30px auto 0;
            padding: 14px 18px;
            font-family: Arial, sans-serif;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: #2563eb;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            touch-action: manipulation;
        }

        #restartButton:active {
            background: #1d4ed8;
            transform: scale(0.98);
        }

        /* ==========================================
           NAVIGATION BUTTONS
           ========================================== */

        .navigation {
            display: flex;
            justify-content: flex-start;
            gap: 12px;
            margin-top: 8px;
        }

        .navigation button {
            flex: 0 0 auto;
            min-width: 120px;
            min-height: 54px;
            padding: 14px;
            font-family: Arial, sans-serif;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            touch-action: manipulation;
        }

        #prevButton {
            color: #374151;
            background: #e5e7eb;
        }

        #nextButton {
            color: white;
            background: #2563eb;
        }
        #prevBtn,
        #nextBtn {
        width: 140px;
        height: 50px;
        font-size: 18px;
        }

        .navigation button:active {
            transform: scale(0.98);
        }

        .navigation button:disabled {
            opacity: 0.45;
            cursor: default;
        }

        /* ==========================================
           SMALL PHONE
           ========================================== */
    
        @media (max-width: 480px) {
    
            .quiz {
                padding: 18px 14px 35px;
            }
    
            #question {
                font-size: 21px;
    
                line-height: 1.5;
            }
    
            .option {
                font-size: 18px;
    
                min-height: 58px;
    
                padding: 15px 16px;
            }
    
            #score {
                font-size: 17px;
            }
    
            #feedback {
                font-size: 17px;
            }
    
        }
    
    
        /* ==========================================
           LARGE PHONE / TABLET
           ========================================== */
    
        @media (min-width: 600px) {
    
            .quiz {
                padding-top: 35px;
            }
    
            #question {
                font-size: 25px;
            }
    
            .option {
                font-size: 20px;
            }
    
        }


        /* ==========================================
           INFO POPUP (shown on wrong answer)
           ========================================== */

        #infoOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(17, 24, 39, 0.55);
            align-items: flex-end;
            justify-content: center;
            padding: 0;
            z-index: 1000;
        }

        #infoOverlay.visible {
            display: flex;
        }

        #infoBox {
            width: 100%;
            max-width: 480px;
            max-height: 75vh;
            overflow-y: auto;
            background: #ffffff;
            border-radius: 18px 18px 0 0;
            padding: 24px 22px calc(24px + env(safe-area-inset-bottom, 0px));
            box-shadow: 0 -8px 30px rgba(0,0,0,0.25);
        }

        #infoWord {
            font-size: 22px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 12px;
        }

        #infoMeaning {
            font-size: 17px;
            line-height: 1.5;
            color: #1f2937;
            margin-bottom: 14px;
        }

        #infoMeaning span.label {
            font-weight: bold;
            color: #374151;
        }

        #infoExample {
            font-size: 16px;
            line-height: 1.5;
            color: #4b5563;
            font-style: italic;
            margin-bottom: 20px;
        }

        #infoExample span.label {
            font-weight: bold;
            font-style: normal;
            color: #374151;
        }

        #infoCloseButton {
            width: 100%;
            min-height: 50px;
            font-family: Arial, sans-serif;
            font-size: 17px;
            font-weight: bold;
            color: white;
            background: #2563eb;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            touch-action: manipulation;
        }

        #infoCloseButton:active {
            background: #1d4ed8;
            transform: scale(0.98);
        }
    
    </style>

</head>


<body>


<div class="quiz">

    <div id="progress"></div>

    <div id="score"></div>

    <div id="question"></div>

    <div id="options"></div>

    <div id="feedback"></div>

    <div class="navigation">
        <button id="prevButton" onclick="previousQuestion()">Previous</button>
    </div>

    <div id="result"></div>

    <button id="restartButton" onclick="restartQuiz()">
        Restart from Question 1
    </button>

</div>

<!-- Popup shown when the wrong answer is chosen -->
<div id="infoOverlay" onclick="if(event.target===this) closeInfo()">
    <div id="infoBox">
        <div id="infoWord"></div>
        <div id="infoMeaning"></div>
        <div id="infoExample"></div>
        <button id="infoCloseButton" onclick="closeInfo()">Got it</button>
    </div>
</div>


<script>

const vocabulary = {
    freedom:"the state of being free and allowed to do what you want",

transition:"the act or process of changing from one form or state to another",

challenge:"something that tests strength, skill, or ability, especially in a way that is interesting",

address:"to try to deal with a problem or question, for example by thinking carefully about it, or by doing things to improve a situation",

gather:"to look for and find information or documents in different places",

syllabus:"a course outline",

presentation:"a formal talk about a particular subject",

semester:"a period of half a year, especially in a school or university",

schedule:"a plan that shows when activities or events are supposed to happen",

respectful:"feeling or showing respect",

advisor:"a person who gives advice, especially about education or academic matters",

responsibility:"something that you must do as part of your job or duty",

"deal with":"to take the necessary action, especially in order to solve a problem",

"have ... in common":"to have the same interests, attitudes, qualities, etc. as another person or group",

"agree on":"to have or express the same opinion about something as sb. else",

"work out":"to deal with a problem in a satisfactory way",

"work through":"to deal with something such as a problem or a strong feeling by thinking and talking about it",

metro:"a railway system that runs underground below a city",

pace:"the speed at which sb. walks, runs, or moves; the speed at which something happens or is done",

tip:"a small amount of additional money that you give to sb. such as a waiter or taxi driver; a helpful piece of advice",

lean:"to support yourself in a sloping position against a wall or other surface",

normal:"usual or typical",

applaud:"to hit your open hands together to show that you have enjoyed a play, concert, speaker, etc.",

recognition:"public respect and thanks for sb.'s work or achievements",

million:"the number 1,000,000",

experiment:"a scientific test done to find out how something reacts under certain conditions, or to find out if a particular idea is true",

perception:"the natural ability to understand or notice things quickly",

priority:"the thing that you think is most important and that needs attention before anything else",

moment:"a very short period of time",

"go by":"if time goes by, it passes",

"all the time":"continuously or very often",

"without exception":"used to say that something is true of all the people or things in a group",

"take over":"to become bigger or more important than something else; to replace something; to take control of something",

"sell out":"if products, tickets for an event, etc. sell out, they are all sold and there are none left",

"turn out":"to happen in a particular way, or to have a particular result, especially one that you did not expect",

gently:"in a gentle way",

roost:"a place where birds rest and sleep",

tend:"to care for sb. or something",

wave:"to raise your arm or move your hand from side to side in order to make sb. notice you",

adventure:"an exciting experience in which dangerous or unusual things happen",

tragedy:"something that seems very sad and unnecessary because something will be wasted, lost, or harmed",

irresponsible:"doing careless things without thinking or worrying about the possible bad results",

politician:"a person who is involved in politics, especially as an elected representative",

devoted:"giving sb. or something a lot of love and attention",

eternal:"continuing for ever and having no end",

mystery:"the quality that sb. or something has when they seem strange, secret, or difficult to understand or explain; an event or situation that people do not understand or cannot explain",

cheat:"to behave in a dishonest way in order to win or to get an advantage, especially in a competition, game, or examination",

intelligence:"the ability to learn, understand, and think about things",

soul:"the spiritual part of a person",

troublemaker:"sb. who deliberately causes problems or arguments",

spoil:"to give a child everything they want, or let them do whatever they want, often with the result that they behave badly",

fellow:"a boy or man; a person",

"a while":"a period of time, especially a short one",

"sort of":"used to make what you are saying sound less strong or direct",

"up to":"for the whole of a period until a certain time or date; as much or as many as a certain amount or number but not more",

"have faith in":"to have a strong feeling of trust or confidence in sb. or something",

"put a price on":"to say how much something costs or is worth",

"close one's ears to":"to refuse to listen to something, especially bad news"

};

// ======================================================
// GENERATE 50 RANDOM QUIZ QUESTIONS
// ======================================================

function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

function generateQuizQuestions(numberOfQuestions = 50) {

    const allWords = Object.entries(vocabulary);

    // Randomly select 50 different vocabulary items
    const selectedWords = shuffle([...allWords])
        .slice(0, Math.min(numberOfQuestions, allWords.length));

    const questions = selectedWords.map(([word, definition]) => {

        // Get three other words as distractors
        const otherWords = allWords
            .filter(([w]) => w !== word)
            .map(([w]) => w);

        // Randomly select 3 distractors
        const distractors = shuffle([...otherWords]).slice(0, 3);

        // Create four choices
        const options = [
            word,
            ...distractors
        ];

        // Shuffle the four choices
        shuffle(options);

        // Find the position of the correct answer
        const answerIndex = options.indexOf(word);

        const answerLetter =
            String.fromCharCode(65 + answerIndex);

        // Clean the definition
        const meaning = definition
            .replace(/<br\s*\/?>/gi, " ")
            .replace(/\s+/g, " ")
            .trim();

        return `${meaning}
A. ${options[0]}
B. ${options[1]}
C. ${options[2]}
D. ${options[3]}
Answer: ${answerLetter}
Meaning: ${meaning}
Example: The teacher discussed "${word}" in class.`;

    });

    return questions.join("\n\n");
}


// Generate exactly 50 questions
const questionText = generateQuizQuestions(50);function parseQuestions(text) {

    // Normalize line breaks

    text = text.replace(/\r\n/g, "\n");


    // Split questions at blank lines

    const blocks = text
        .trim()
        .split(/\n\s*\n/);


    const questions = [];


    blocks.forEach(function(block) {

        const lines = block
            .split("\n")
            .map(line => line.trim())
            .filter(line => line !== "");


        if (lines.length < 6) {
            return;
        }


        // ----------------------------------------------
        // Question
        // ----------------------------------------------

        const question = lines[0];


        // ----------------------------------------------
        // Options
        // ----------------------------------------------

        const options = [];

        for (let i = 1; i <= 4; i++) {

            let option = lines[i];


            // Remove A. B. C. D.
            // Also accepts A. option, A) option, etc.

            option = option.replace(
                /^[A-Da-d]\s*[\.\)]\s*/,
                ""
            );


            options.push(option);

        }


        // ----------------------------------------------
        // Answer
        // ----------------------------------------------

        const answerLine = lines[5];


        const match = answerLine.match(
            /Answer\s*:\s*([A-Da-d1-4])/i
        );


        if (!match) {
            console.warn(
                "Could not find answer:",
                answerLine
            );

            return;
        }


        const answerValue =
            match[1].toUpperCase();


        let answer;


        // If answer is A/B/C/D

        if (
            answerValue === "A" ||
            answerValue === "B" ||
            answerValue === "C" ||
            answerValue === "D"
        ) {

            answer =
                answerValue.charCodeAt(0) -
                "A".charCodeAt(0) +
                1;

        }


        // If answer is 1/2/3/4

        else {

            answer =
                parseInt(answerValue);

        }


        // ----------------------------------------------
        // Optional Meaning / Example lines
        // ----------------------------------------------

        let meaning = "";
        let example = "";

        for (let i = 6; i < lines.length; i++) {

            const meaningMatch = lines[i].match(
                /^Meaning\s*:\s*(.+)$/i
            );

            const exampleMatch = lines[i].match(
                /^Example\s*:\s*(.+)$/i
            );

            if (meaningMatch) {
                meaning = meaningMatch[1];
            } else if (exampleMatch) {
                example = exampleMatch[1];
            }

        }


        questions.push({

            question: question,

            options: options,

            answer: answer,

            meaning: meaning,

            example: example

        });

    });


    return questions;

}


// ======================================================
// CREATE QUESTION ARRAY
// ======================================================

const questions =
    parseQuestions(questionText);


// ======================================================
// VARIABLES
// ======================================================

let currentQuestion = 0;

let score = 0;


// ======================================================
// DISPLAY QUESTION
// ======================================================

function displayQuestion() {

    document.querySelector(".navigation").style.display =
        "flex";

    const question = questions[currentQuestion];

    // Question number
    document.getElementById("progress").textContent =
        "Question " +
        (currentQuestion + 1) +
        " / " +
        questions.length;

    // Current score
    document.getElementById("score").textContent =
        "Score: " +
        score;

    // Display question
    document.getElementById("question").textContent =
        question.question;

    // Clear old options
    const optionsDiv =
        document.getElementById("options");

    optionsDiv.innerHTML = "";

    // Clear feedback
    document.getElementById("feedback").textContent = "";

    // Create buttons
    question.options.forEach(function(option, index) {

        const button =
            document.createElement("button");

        button.className = "option";

        button.textContent =
            String.fromCharCode(65 + index) +
            ". " +
            option;

        button.addEventListener(
            "click",
            function() {
                checkAnswer(index, button);
            }
        );

        optionsDiv.appendChild(button);
    });

    // Previous button
    document.getElementById("prevButton").disabled =
        currentQuestion === 0;
}


// ======================================================
// CHECK ANSWER
// ======================================================

function checkAnswer(selectedIndex, button) {

    const question =
        questions[currentQuestion];

    // Prevent answering the same question twice
    const buttons =
        document.querySelectorAll(".option");

    buttons.forEach(function(btn) {
        btn.disabled = true;
    });

    // Correct answer
    if (selectedIndex + 1 === question.answer) {

score += 2;

button.classList.add("correct");

        document.getElementById("feedback").textContent =
            "Correct!";

        // Automatically move on after a short pause
        setTimeout(goToNextOrFinish, 900);
    }

    // Wrong answer
    else {

        button.classList.add("wrong");

        // Show the correct answer
        buttons[
            question.answer - 1
        ].classList.add("correct");

        document.getElementById("feedback").textContent =
            "Wrong.";

        // Show the info popup for the correct answer
        showInfo(question);
    }

    // Update score
    document.getElementById("score").textContent =
        "Score: " +
        score;
}


// ======================================================
// SHOW / CLOSE INFO POPUP
// ======================================================

function showInfo(question) {

    const correctOption =
        question.options[question.answer - 1];

    document.getElementById("infoWord").textContent =
        correctOption;

    document.getElementById("infoMeaning").innerHTML =
        question.meaning
            ? "<span class='label'>Meaning: </span>" + question.meaning
            : "";

    document.getElementById("infoExample").innerHTML =
        question.example
            ? "<span class='label'>Example: </span>" + question.example
            : "";

    document.getElementById("infoOverlay").classList.add("visible");
}


function closeInfo() {

    document.getElementById("infoOverlay").classList.remove("visible");

    // Automatically move on once the popup is dismissed
    goToNextOrFinish();
}


// ======================================================
// PREVIOUS QUESTION
// ======================================================

function previousQuestion() {

    if (currentQuestion > 0) {

        currentQuestion--;

        displayQuestion();
    }
}


// ======================================================
// GO TO NEXT QUESTION (OR FINISH)
// ======================================================

function goToNextOrFinish() {

    if (currentQuestion < questions.length - 1) {

        currentQuestion++;

        displayQuestion();
    }

    else {

        showResult();
    }
}


// ======================================================
// RESTART QUIZ
// ======================================================

function restartQuiz() {

    currentQuestion = 0;

    score = 0;

    document.getElementById("result").innerHTML = "";

    document.getElementById("restartButton").style.display =
        "none";

    displayQuestion();
}


// ======================================================
// SHOW FINAL RESULT
// ======================================================

function showResult() {

    const totalQuestions =
        questions.length;


    const percentage =
        (score / totalQuestions) * 100;


    const mark =
        percentage.toFixed(2);


    // Clear quiz

    document.getElementById("progress").textContent = "";

    document.getElementById("score").textContent = "";

    document.getElementById("question").textContent = "";

    document.getElementById("options").innerHTML = "";

    document.getElementById("feedback").textContent = "";

    document.querySelector(".navigation").style.display =
        "none";

    document.getElementById("restartButton").style.display =
        "block";


    // Display result

    document.getElementById("result").innerHTML =

        "Quiz Finished!<br><br>" +

        "Correct answers: " +
        score +
        " / " +
        totalQuestions +

        "<br><br>" +

        "Mark: " +
        mark +
        " / 100";

}


// ======================================================
// START QUIZ
// ======================================================

if (questions.length > 0) {

    displayQuestion();

}

else {

    document.getElementById("question").textContent =
        "No questions found.";

}


</script>


</body>

</html>
